<!DOCTYPE html>
<html>
<head>
    <title>Earthquake Map Visualization</title>
    <!-- นำเข้าฟอนต์ TH Sarabun New -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <style>
        #map {
            height: 100vh;
            width: 100%;
        }

        /* โครงสร้างพื้นฐานของจุดแผ่นดินไหว */
        .earthquake-node {
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            border: 2px solid #FFFFFF;
            box-shadow: 0 0 4px rgba(0,0,0,0.4);
            cursor: pointer; /* แสดงไอคอนรูปมือเมื่อเลื่อนเมาส์มาชี้ */
            box-sizing: border-box;
            transition: transform 0.2s ease;
        }

        /* เอฟเฟกต์เมื่อเอาเมาส์ไปชี้ที่จุด (Hover) */
        .earthquake-node:hover {
            transform: scale(1.15);
        }

        /* ตัวเลขแมกนิจูด ฟอนต์ TH Sarabun New */
        .magnitude-label {
            font-family: 'TH Sarabun New', sans-serif;
            font-weight: bold;
            font-size: 22px;
            color: #FFFFFF;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            user-select: none;
            line-height: 1;
            pointer-events: none; /* เพื่อให้เหตุการณ์คลิกทะลุไปที่วงกลมด้านหลัง */
        }

        /* เอฟเฟกต์แอนิเมชันกระพริบขยายขนาดวนลูป (Pulse) */
        @keyframes pulse-animation {
            0% {
                transform: scale(1);
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7);
            }
            50% {
                transform: scale(1.25);
                opacity: 0.4;
                box-shadow: 0 0 0 15px rgba(255, 0, 0, 0);
            }
            100% {
                transform: scale(1);
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0);
            }
        }

        /* Class บังคับเล่นแอนิเมชันต่อเนื่อง */
        .pulsing {
            animation: pulse-animation 1.2s infinite ease-in-out !important;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        async function initMap() {
            // โหลด Map และ Marker Library จาก Google Maps API
            const { Map } = await google.maps.importLibrary("maps");
            const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

            const map = new Map(document.getElementById("map"), {
                zoom: 6,
                center: { lat: 14.50, lng: 101.0 },
                mapId: "DEMO_MAP_ID", // ใช้ DEMO_MAP_ID สำหรับการทดสอบ
            });

            // ข้อมูลตำแหน่งแผ่นดินไหว 3 จุด พร้อม URL ลิงก์เชื่อมโยง
            const earthquakes = [
                { 
                    lat: 18.788, 
                    lng: 98.985, 
                    mag: 3.2, 
                    title: "เหตุการณ์แผ่นดินไหวขนาด 3.2",
                    url: "https://earthquake.tmd.go.th/" // ใส่ URL หน้าเว็บที่ต้องการเปิด
                },
                { 
                    lat: 14.200, 
                    lng: 99.500, 
                    mag: 5.5, 
                    title: "คณะมนุษยศาสตร์และสังคมศาสตร์",
                    url: "https://earthquake.usgs.gov/"
                },
                { 
                    lat: 10.500, 
                    lng: 95.000, 
                    mag: 7.8, 
                    title: "เหตุการณ์แผ่นดินไหวรุนแรงขนาด 7.8",
                    url: "https://www.google.com"
                }
            ];

            function getColor(mag) {
                if (mag >= 7.0) return "#FF0000";
                if (mag >= 5.0) return "#FF8C00";
                return "#228B22";
            }

            earthquakes.forEach((eq) => {
                const color = getColor(eq.mag);
                const sizePx = Math.max(eq.mag * 7, 24); // คำนวณขนาดเส้นผ่านศูนย์กลาง (px)
                const isLarge = eq.mag >= 5.0;

                // 1. สร้าง Custom HTML Element สำหรับเป็นตัวจุด
                const circleEl = document.createElement("div");
                circleEl.className = "earthquake-node";
                circleEl.style.width = `${sizePx}px`;
                circleEl.style.height = `${sizePx}px`;
                circleEl.style.backgroundColor = color;
                circleEl.title = `${eq.title} (คลิกเพื่อดูรายละเอียด)`; 

                // 2. ใส่ตัวเลขแมกนิจูดข้างในจุด
                const labelEl = document.createElement("span");
                labelEl.className = "magnitude-label";
                labelEl.innerText = eq.mag.toFixed(1);
                circleEl.appendChild(labelEl);

                // 3. ถ้าเป็นจุดใหญ่ ให้ใส่ Class กระพริบ
                if (isLarge) {
                    circleEl.classList.add("pulsing");
                }

                // 4. เพิ่ม Event Listener เมื่อผู้ใช้กดคลิกที่จุด ให้เปิด URL ในแท็บใหม่
                circleEl.addEventListener("click", () => {
                    if (eq.url) {
                        window.open(eq.url, "_blank");
                    }
                });

                // 5. แสดงผลลงบนแผนที่ผ่าน AdvancedMarkerElement
                new AdvancedMarkerElement({
                    map: map,
                    position: { lat: eq.lat, lng: eq.lng },
                    content: circleEl,
                });
            });
        }
    </script>

    <!-- ใส่ API Key ของคุณใน YOUR_API_KEY -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC5l0aPyGFqiqY5DpqOYf-8YhN_eYHHobU&callback=initMap"
    async defer></script>
</body>
</html>
